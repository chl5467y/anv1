name: Extractor Automatico de Anime

on:
  workflow_dispatch: # Esto nos da el botón para activarlo manualmente

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar librerias y dependencias de Playwright
        run: |
          pip install playwright beautifulsoup4 lxml firebase-admin
          python -m playwright install chromium
          python -m playwright install-deps chromium 

      - name: Ejecutar Extractor Real
        run: python animev1_tracker.py
