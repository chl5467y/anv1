name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Mover archivos fuente a lib/
        run: |
          mkdir -p lib
          if [ -f main.dart ]; then mv main.dart lib/main.dart; fi
          if [ -f firebase_options.dart ]; then mv firebase_options.dart lib/firebase_options.dart; fi
      - name: Generar carpetas de Android faltantes
        run: flutter create --platforms=android .
      - name: Actualizar version de Kotlin
        run: |
          if [ -f android/settings.gradle ]; then
            sed -i 's/org.jetbrains.kotlin.android" version "[^"]*"/org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle
          fi
          if [ -f android/settings.gradle.kts ]; then
            sed -i 's/org.jetbrains.kotlin.android") version "[^"]*"/org.jetbrains.kotlin.android") version "1.9.24"/' android/settings.gradle.kts
          fi
      - name: Configurar Google Services (Firebase)
        run: |
          if [ -f android/settings.gradle ] && ! grep -q "com.google.gms.google-services" android/settings.gradle; then
            sed -i '/id "com.android.application" version/a\    id "com.google.gms.google-services" version "4.4.2" apply false' android/settings.gradle
          fi
          if [ -f android/app/build.gradle ] && ! grep -q "com.google.gms.google-services" android/app/build.gradle; then
            sed -i '/^plugins {/a\    id "com.google.gms.google-services"' android/app/build.gradle
          fi
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
